<!doctype html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRISP</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #ededed;
      color: #1b1534;
    }

    #initial-loader .logo-dark {
      display: none;
    }

    #initial-loader .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(27, 21, 52, 0.15);
      border-top-color: #4d217a;
      animation: initial-spin 0.8s linear infinite;
    }

    @keyframes initial-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-color-scheme: dark) {
      #initial-loader {
        background-image: radial-gradient(78.46% 78.46% at 88.53% 84.13%, #4d217a 0%, #1b1534 100%);
        background-color: #1b1534;
        color: #ffffff;
      }

      #initial-loader .logo-light {
        display: none;
      }

      #initial-loader .logo-dark {
        display: block;
      }

      #initial-loader .spinner {
        border-color: rgba(255, 255, 255, 0.18);
        border-top-color: #ffffff;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader" aria-live="polite" aria-busy="true">
      <img class="logo-light" src="/logo.svg" alt="CRISP" width="180" height="62" />
      <img class="logo-dark" src="/logo_white.svg" alt="CRISP" width="180" height="62" />
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
