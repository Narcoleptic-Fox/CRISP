name: CI (client)

on:
  push:
    branches: [master, modernize]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  client:
    name: Build and test (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/CRISP.Client/.nvmrc
          cache: npm
          cache-dependency-path: src/CRISP.Client/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/CRISP.Client
      # TypeGen emits src/api from Core; the client does not compile without it.
      - run: dotnet build src/CRISP.Core/CRISP.Core.csproj --configuration Release
      - run: npm run check
        working-directory: src/CRISP.Client
